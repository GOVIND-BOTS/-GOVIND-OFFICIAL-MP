name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "HTTPS URL of the deployed GOVIND OFFICIAL MP server"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install image tooling
        run: python -m pip install --user Pillow
      - name: Prepare app photo and launcher icons
        run: python android/scripts/prepare_assets.py
      - name: Build debug APK
        env:
          INPUT_SERVER_URL: ${{ inputs.server_url }}
        run: |
          SERVER_URL="${INPUT_SERVER_URL:-https://govind-official-mp.onrender.com}"
          gradle -p android assembleDebug -PserverUrl="$SERVER_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: govind-official-mp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
