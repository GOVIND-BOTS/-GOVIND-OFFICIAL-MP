plugins { id 'com.android.application' }

def serverUrl = (project.findProperty("serverUrl") ?: "https://YOUR-RENDER-SERVICE.onrender.com").toString().replaceAll('/+$', '')

android {
    namespace 'com.govind.officialmp'
    compileSdk 35
    defaultConfig {
        applicationId 'com.govind.officialmp'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'SERVER_URL', '"' + serverUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
